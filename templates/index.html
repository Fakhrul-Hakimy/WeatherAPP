<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="display-4">Weather App</h1>
            <p class="lead">Get real-time weather updates for any city!</p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" class="row g-3">
                    <div class="col-md-9">
                        <label for="city" class="form-label">Enter City:</label>
                        <input type="text" id="city" name="city" class="form-control" placeholder="e.g., London" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Get Weather</button>
                    </div>
                </form>
            </div>
        </div>
        {% if weather %}
        <div class="mt-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center">Weather in {{ weather.city }}</h2>
                    <p class="card-text text-center">
                        <strong>Temperature:</strong> {{ weather.temperature }}°C<br>
                        <strong>Description:</strong> {{ weather.description }}<br>
                        <strong>Humidity:</strong> {{ weather.humidity }}%
                    </p>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
